<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RIOFLIX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1 class="page-title" id="pageTitle"></h1>
    <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="clearAll()" id="clearBtn"></button>
  </div>
  <div id="list"></div>
</div>
<script src="js/db.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script>
const profile = bootPage(null);
function render(){
  document.getElementById('pageTitle').textContent = t('viewingHistory');
  document.getElementById('clearBtn').textContent = currentLang()==='ar'?'حذف الكل':'Clear All';
  const p = DB.getActiveProfile();
  const hist = p.history||[];
  const list = document.getElementById('list');
  if(!hist.length){ list.innerHTML = emptyStateHtml(t('myListEmpty'), t('myListEmptySub')); return; }
  list.innerHTML = hist.map(h=>{
    const tt = DB.getTitle(h.titleId); if(!tt) return '';
    const pct = h.duration ? Math.round((h.time/h.duration)*100) : 0;
    return `<div style="display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;">
      <img src="${tt.poster}" style="width:60px;height:90px;object-fit:cover;border-radius:4px;">
      <div style="flex:1;">
        <div style="font-weight:600;">${titleDisplayName(tt)} ${h.season?` · S${h.season} E${h.episode}`:''}</div>
        <div style="color:var(--muted);font-size:12.5px;margin-top:3px;">${pct}% · ${new Date(h.at).toLocaleDateString()}</div>
      </div>
      <button class="link-btn danger" onclick="removeOne('${h.titleId}')">${t('delete')}</button>
    </div>`;
  }).join('');
  renderFooter();
}
function removeOne(titleId){
  DB.updateActiveProfile(p=>{ p.history=(p.history||[]).filter(h=>h.titleId!==titleId); });
  render();
}
function clearAll(){
  if(confirm(currentLang()==='ar'?'حذف كل السجل؟':'Clear all history?')){
    DB.updateActiveProfile(p=>{ p.history=[]; });
    render();
  }
}
if(profile) render();
</script>
</body>
</html>
