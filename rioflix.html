<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RIOFLIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060504;
  --bg-alt:#0b0908;
  --surface:#131110;
  --surface-2:#1c1917;
  --surface-3:#262220;
  --hair:#2c2825;
  --text:#f4f0ea;
  --muted:#a89f95;
  --dim:#6f675f;
  --accent:#e6a95c;
  --accent-2:#c2410c;
  --accent-grad: linear-gradient(120deg,#f2c185 0%,#e6a95c 35%,#c2410c 100%);
  --danger:#e0555a;
  --good:#6fae7d;
  --radius:12px;
  --radius-lg:20px;
  --shadow: 0 20px 60px rgba(0,0,0,.55);
  --ease: cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);}
body{font-family:'Tajawal','Inter',sans-serif; overflow-x:hidden; -webkit-font-smoothing:antialiased;}
html[dir="ltr"] body{font-family:'Inter','Tajawal',sans-serif;}
::selection{background:var(--accent); color:#1a1200;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
img{-webkit-user-drag:none;}
.brand{
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:.08em;
  background:var(--accent-grad);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hidden{display:none !important;}
.icon{display:inline-block; vertical-align:middle;}
.icon svg{display:block;}
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  border:none; border-radius:8px; padding:12px 22px; font-weight:700; font-size:15px;
  transition:transform .18s var(--ease), background .18s var(--ease), opacity .18s var(--ease);
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--text); color:#111;}
.btn-primary:hover{background:#fff;}
.btn-ghost{background:rgba(120,120,120,.28); color:var(--text); backdrop-filter:blur(8px);}
.btn-ghost:hover{background:rgba(140,140,140,.4);}
.btn-outline{background:transparent; border:1.5px solid var(--hair); color:var(--text);}
.btn-outline:hover{border-color:var(--muted);}
.btn-icon{width:42px; height:42px; border-radius:50%; background:rgba(120,120,120,.28); display:inline-flex; align-items:center; justify-content:center; border:none; color:var(--text);}
.btn-icon:hover{background:rgba(150,150,150,.4);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:6px;}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed; inset:0; background:radial-gradient(120% 100% at 50% 20%, #140f0a 0%, #060504 60%);
  display:flex; align-items:center; justify-content:center; z-index:9999;
  animation: splashOut .6s var(--ease) 1.9s forwards;
}
#splash .mark{
  font-family:'Bebas Neue',sans-serif; font-size:min(16vw,110px); letter-spacing:.12em;
  background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  opacity:0; transform:scale(.85);
  animation: markIn 1s var(--ease) .15s forwards;
  position:relative;
}
#splash .mark::after{
  content:""; position:absolute; left:0; right:0; bottom:-10px; height:3px;
  background:var(--accent-grad); transform:scaleX(0); transform-origin:50%;
  animation: lineIn .7s var(--ease) .9s forwards;
}
#splash .sweep{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
#splash .sweep::before{
  content:""; position:absolute; top:0; bottom:0; width:40%; left:-50%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
  animation: sweep 1.6s var(--ease) .3s forwards;
}
@keyframes markIn{to{opacity:1; transform:scale(1);}}
@keyframes lineIn{to{transform:scaleX(1);}}
@keyframes sweep{to{left:120%;}}
@keyframes splashOut{to{opacity:0; visibility:hidden;}}

/* ---------- PROFILE SELECT ---------- */
.profile-screen{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; text-align:center;}
.profile-screen h1{font-size:clamp(22px,4vw,34px); font-weight:700; margin:0 0 40px;}
.profile-grid{display:flex; flex-wrap:wrap; gap:26px; justify-content:center; max-width:820px;}
.profile-item{display:flex; flex-direction:column; align-items:center; gap:12px; cursor:pointer; width:120px;}
.avatar{
  width:104px; height:104px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue',sans-serif; font-size:38px; color:#1a1200; border:3px solid transparent;
  transition:border-color .2s var(--ease), transform .2s var(--ease), filter .2s var(--ease);
}
.profile-item:hover .avatar{border-color:var(--text); transform:translateY(-4px);}
.profile-item.kids .avatar{border-radius:50%;}
.profile-item span{color:var(--muted); font-size:15px; font-weight:600;}
.profile-item:hover span{color:var(--text);}
.profile-item.add .avatar{background:var(--surface-2); border:2px dashed var(--hair); color:var(--muted); font-size:32px;}
.profile-item.add:hover .avatar{border-color:var(--accent); color:var(--accent);}
.manage-link{margin-top:44px; color:var(--muted); border:1.5px solid var(--hair); padding:10px 26px; border-radius:6px; letter-spacing:.03em; font-size:14px; font-weight:600;}
.manage-link:hover{color:var(--text); border-color:var(--muted);}

.modal-backdrop{position:fixed; inset:0; background:rgba(4,3,2,.72); backdrop-filter:blur(6px); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .2s var(--ease);}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal{background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius-lg); padding:32px; width:100%; max-width:440px; max-height:88vh; overflow:auto; animation:modalIn .25s var(--ease);}
@keyframes modalIn{from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none}}
.modal h2{margin:0 0 22px; font-size:22px;}
.field{margin-bottom:16px; text-align:start;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600;}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=url],.field select,.field textarea{
  width:100%; background:var(--surface-2); border:1.5px solid var(--hair); border-radius:8px; padding:11px 12px;
  color:var(--text); font-size:14px; font-family:inherit; transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent);}
.field textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.swatches{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.swatch{width:36px; height:36px; border-radius:9px; cursor:pointer; border:2px solid transparent;}
.swatch.sel{border-color:var(--text);}
.check-row{display:flex; align-items:center; gap:10px; margin-bottom:16px; color:var(--muted); font-size:14px;}
.modal-actions{display:flex; gap:10px; margin-top:22px; justify-content:flex-end;}
.modal-close{position:absolute; top:20px; inset-inline-end:20px;}
.modal{position:relative;}

/* ---------- SHELL / NAV ---------- */
#app{min-height:100%; padding-bottom:70px;}
.navbar{
  position:fixed; top:0; inset-inline:0; z-index:200; display:flex; align-items:center; justify-content:space-between;
  padding:16px 32px; transition:background .25s, padding .25s, box-shadow .25s; gap:20px;
}
.navbar.scrolled{background:rgba(6,5,4,.92); backdrop-filter:blur(14px); box-shadow:0 1px 0 var(--hair);}
.nav-left{display:flex; align-items:center; gap:34px;}
.nav-logo{font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:.08em;}
.nav-links{display:flex; gap:24px; font-size:14.5px; color:var(--muted); font-weight:600;}
.nav-links a{padding:4px 0; border-bottom:2px solid transparent; transition:color .15s;}
.nav-links a:hover,.nav-links a.active{color:var(--text);}
.nav-links a.active{border-color:var(--accent);}
.nav-right{display:flex; align-items:center; gap:14px;}
@media (max-width:900px){ .nav-links{display:none;} .navbar{padding:14px 16px;} }

.bottom-nav{
  position:fixed; bottom:0; inset-inline:0; z-index:200; display:none; justify-content:space-around; align-items:center;
  background:rgba(10,8,7,.96); backdrop-filter:blur(14px); border-top:1px solid var(--hair); padding:9px 4px 12px;
}
@media (max-width:900px){ .bottom-nav{display:flex;} #app{padding-bottom:78px;} }
.bn-item{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--dim); font-size:10.5px; font-weight:600; flex:1;}
.bn-item.active{color:var(--accent);}

/* ---------- HERO ---------- */
.hero{position:relative; height:min(88vh,760px); min-height:460px; display:flex; align-items:flex-end; overflow:hidden;}
.hero-bg{position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.02); transition:opacity .6s var(--ease);}
.hero-bg::after{content:""; position:absolute; inset:0; background:
  linear-gradient(0deg, var(--bg) 2%, rgba(6,5,4,.15) 40%, rgba(6,5,4,.55) 100%),
  linear-gradient(90deg, rgba(6,5,4,.85) 0%, rgba(6,5,4,.15) 55%, transparent 100%);}
.hero-content{position:relative; z-index:2; padding:0 32px 64px; max-width:640px;}
.hero-badge{display:inline-flex; align-items:center; gap:8px; color:var(--accent); font-weight:800; font-size:12.5px; letter-spacing:.12em; margin-bottom:14px;}
.hero-title{font-family:'Bebas Neue',sans-serif; font-size:clamp(38px,7vw,74px); line-height:.98; letter-spacing:.02em; margin:0 0 14px;}
html[dir="rtl"] .hero-title{font-family:'Tajawal',sans-serif; font-weight:900; letter-spacing:0;}
.hero-meta{display:flex; align-items:center; gap:12px; color:var(--muted); font-size:14px; font-weight:600; margin-bottom:16px; flex-wrap:wrap;}
.hero-meta .dot{width:3px; height:3px; background:var(--dim); border-radius:50%;}
.hero-desc{color:#d8d2c8; font-size:15.5px; line-height:1.65; margin:0 0 24px; max-width:520px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
@media (max-width:600px){ .hero-content{padding:0 16px 44px;} .hero-desc{-webkit-line-clamp:2;} }

/* ---------- ROWS / CARDS ---------- */
.rows-wrap{position:relative; z-index:3; margin-top:-90px; padding-bottom:60px;}
@media (max-width:600px){.rows-wrap{margin-top:-40px;}}
.row-block{margin-bottom:38px;}
.row-head{display:flex; align-items:center; justify-content:space-between; padding:0 32px; margin-bottom:12px;}
.row-title{font-size:18px; font-weight:800;}
.row-see{font-size:12.5px; color:var(--muted); font-weight:700;}
.row-viewport{position:relative; padding:0 32px;}
@media (max-width:600px){.row-head, .row-viewport{padding-inline:16px;}}
.row-track{display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; padding:6px 0 14px; scrollbar-width:none;}
.row-track::-webkit-scrollbar{display:none;}
.row-arrow{position:absolute; top:0; bottom:14px; width:44px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(90deg, var(--bg), transparent); z-index:5; opacity:0; transition:opacity .2s; border:none; color:var(--text);}
.row-viewport:hover .row-arrow{opacity:1;}
.row-arrow.end{inset-inline-end:32px; inset-inline-start:auto; background:linear-gradient(270deg, var(--bg), transparent);}
.row-arrow.start{inset-inline-start:32px;}
@media (max-width:900px){.row-arrow{display:none;}}

.card{
  position:relative; flex:0 0 auto; width:200px; border-radius:9px; overflow:hidden; cursor:pointer;
  background:var(--surface-2); transition:transform .28s var(--ease), z-index 0s; z-index:1;
}
.card:hover{transform:scale(1.08) translateY(-6px); z-index:8; box-shadow:var(--shadow);}
.card-poster{width:100%; aspect-ratio:2/3; position:relative; display:flex; align-items:flex-end; padding:12px; overflow:hidden;}
.card-poster .ptitle{font-family:'Bebas Neue',sans-serif; font-size:22px; line-height:1.05; letter-spacing:.02em; color:rgba(255,255,255,.94); text-shadow:0 2px 10px rgba(0,0,0,.5); position:relative; z-index:2;}
html[dir="rtl"] .card-poster .ptitle{font-family:'Tajawal',sans-serif; font-weight:800; font-size:16px;}
.card-poster::before{content:""; position:absolute; inset:0; opacity:.9;}
.card-poster::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(0,0,0,.75) 0%, transparent 55%);}
.card-progress{position:absolute; bottom:0; inset-inline:0; height:4px; background:rgba(255,255,255,.2); z-index:3;}
.card-progress i{display:block; height:100%; background:var(--accent-grad);}
.card-badge{position:absolute; top:8px; inset-inline-start:8px; z-index:3; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:5px; color:var(--text);}
.card-hover{position:absolute; inset:0; z-index:4; background:linear-gradient(0deg, rgba(0,0,0,.92) 10%, rgba(0,0,0,.15) 100%); opacity:0; transition:opacity .2s; display:flex; flex-direction:column; justify-content:flex-end; padding:10px;}
.card:hover .card-hover{opacity:1;}
.card-hover-title{font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--text);}
.card-hover-meta{font-size:10.5px; color:var(--muted); margin-bottom:8px; display:flex; gap:6px; align-items:center;}
.card-hover-actions{display:flex; gap:6px;}
.card-hover-actions button{width:30px; height:30px; border-radius:50%; border:1.5px solid rgba(255,255,255,.5); background:rgba(20,20,20,.6); color:var(--text); display:flex; align-items:center; justify-content:center;}
.card-hover-actions button.primary{background:var(--text); color:#111; border-color:var(--text);}
.card-hover-actions button:hover{border-color:var(--text);}
.card-hover-actions button.active{background:var(--accent); border-color:var(--accent); color:#1a1200;}
@media (max-width:600px){.card{width:128px;} .card-poster .ptitle{font-size:15px;} html[dir=rtl] .card-poster .ptitle{font-size:12.5px;}}

.top10-track{gap:0;}
.top10-item{position:relative; flex:0 0 auto; display:flex; align-items:flex-end; width:220px;}
.top10-num{font-family:'Bebas Neue',sans-serif; font-size:110px; line-height:1; color:transparent; -webkit-text-stroke:2px var(--hair); margin-inline-end:-24px; z-index:1; user-select:none;}
.top10-item .card{width:150px;}
@media (max-width:600px){.top10-num{font-size:70px;} .top10-item .card{width:110px;} .top10-item{width:150px;}}

/* ---------- SECTION / GRID PAGES ---------- */
.page-head{padding:110px 32px 20px;}
@media (max-width:600px){.page-head{padding:96px 16px 16px;}}
.page-title{font-size:26px; font-weight:800; margin:0 0 6px;}
.page-sub{color:var(--muted); font-size:14px;}
.chip-row{display:flex; gap:10px; flex-wrap:wrap; padding:0 32px 20px;}
@media (max-width:600px){.chip-row{padding-inline:16px;}}
.chip{padding:8px 16px; border-radius:20px; border:1.5px solid var(--hair); font-size:13px; font-weight:700; color:var(--muted); background:transparent;}
.chip.active,.chip:hover{border-color:var(--accent); color:var(--accent);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; padding:0 32px 60px;}
@media (max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); padding:0 16px 60px; gap:10px;}}
.grid .card{width:100%;}

.empty-state{text-align:center; padding:80px 24px; color:var(--muted);}
.empty-state h3{color:var(--text); font-size:20px; margin-bottom:8px;}
.empty-state .icon{margin-bottom:18px; opacity:.5;}

/* ---------- SEARCH ---------- */
.search-page{padding:100px 32px 40px;}
@media (max-width:600px){.search-page{padding:88px 16px 40px;}}
.search-box{display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1.5px solid var(--hair); border-radius:10px; padding:14px 18px; max-width:640px; margin-bottom:26px;}
.search-box input{flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:16px; font-family:inherit;}
.search-box:focus-within{border-color:var(--accent);}
.filters-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px;}
.filters-bar select{background:var(--surface-2); border:1.5px solid var(--hair); color:var(--text); padding:9px 12px; border-radius:8px; font-size:13px; font-family:inherit;}

/* ---------- TITLE PAGE ---------- */
.title-hero{position:relative; height:min(64vh,560px); min-height:340px; display:flex; align-items:flex-end;}
.title-hero .hero-bg{position:absolute; inset:0; background-size:cover; background-position:center;}
.title-hero .hero-bg::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--bg) 4%, rgba(6,5,4,.3) 45%, rgba(6,5,4,.6) 100%);}
.title-body{position:relative; z-index:2; max-width:1100px; margin:-40px auto 0; padding:0 32px 60px;}
@media (max-width:600px){.title-body{padding:0 16px 50px; margin-top:-24px;}}
.title-head{display:flex; gap:26px; align-items:flex-end; margin-bottom:22px;}
.title-poster{width:150px; aspect-ratio:2/3; border-radius:10px; flex:0 0 auto; box-shadow:var(--shadow); position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:10px;}
.title-poster .ptitle{font-family:'Bebas Neue',sans-serif; font-size:20px; color:#fff; position:relative; z-index:2;}
html[dir=rtl] .title-poster .ptitle{font-family:'Tajawal'; font-weight:800; font-size:14px;}
@media (max-width:600px){.title-head{flex-direction:column; align-items:flex-start;} .title-poster{width:110px;}}
.title-name{font-family:'Bebas Neue',sans-serif; font-size:clamp(30px,5vw,50px); line-height:1; margin:0 0 8px;}
html[dir=rtl] .title-name{font-family:'Tajawal'; font-weight:900; letter-spacing:0;}
.title-meta{color:var(--muted); font-size:14px; font-weight:600; display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:6px;}
.score-pill{display:inline-flex; align-items:center; gap:6px; color:var(--accent); font-weight:800;}
.title-actions{display:flex; gap:10px; flex-wrap:wrap; margin:20px 0 26px;}
.title-desc{color:#d8d2c8; line-height:1.75; font-size:15px; max-width:760px; margin-bottom:22px;}
.info-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:32px; font-size:13.5px;}
.info-grid b{color:var(--muted); font-weight:700; display:block; margin-bottom:2px; font-size:12px;}
.rating-block{background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius); padding:22px; margin-bottom:32px;}
.rating-block h4{margin:0 0 12px; font-size:15px;}
.stars{display:inline-flex; gap:4px;}
.stars button{background:none; border:none; padding:2px; color:var(--hair); transition:transform .1s;}
.stars button.filled{color:var(--accent);}
.stars button:hover{transform:scale(1.15);}
.your-rating-note{color:var(--muted); font-size:12.5px; margin-top:8px;}

.season-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
.season-bar select{background:var(--surface-2); border:1.5px solid var(--hair); color:var(--text); padding:10px 14px; border-radius:8px; font-size:14px; font-weight:700; font-family:inherit;}
.ep-list{display:flex; flex-direction:column; gap:2px;}
.ep-row{display:flex; gap:16px; padding:16px 10px; border-bottom:1px solid var(--hair); cursor:pointer; border-radius:8px; transition:background .15s;}
.ep-row:hover{background:var(--surface-2);}
.ep-num{font-family:'Bebas Neue',sans-serif; font-size:30px; color:var(--dim); width:34px; flex:0 0 auto; text-align:center;}
.ep-thumb{width:150px; aspect-ratio:16/9; border-radius:8px; flex:0 0 auto; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.ep-thumb .play-ov{position:absolute; inset:0; background:rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s;}
.ep-row:hover .play-ov{opacity:1;}
@media (max-width:560px){.ep-thumb{width:100px;}}
.ep-info{flex:1; min-width:0;}
.ep-info-top{display:flex; justify-content:space-between; gap:10px; margin-bottom:6px;}
.ep-title{font-weight:700; font-size:14.5px;}
.ep-runtime{color:var(--muted); font-size:12.5px; white-space:nowrap;}
.ep-desc{color:var(--muted); font-size:13px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.ep-rate{margin-top:8px;}
.ep-progress{height:3px; background:var(--hair); border-radius:2px; margin-top:8px; overflow:hidden;}
.ep-progress i{display:block; height:100%; background:var(--accent-grad);}

.section-heading{font-size:19px; font-weight:800; margin:0 0 14px;}

/* ---------- MY LIST ---------- */
.lists-tabs{display:flex; gap:10px; flex-wrap:wrap; padding:0 32px 24px; align-items:center;}
@media (max-width:600px){.lists-tabs{padding-inline:16px;}}
.list-tab{padding:9px 18px; border-radius:20px; border:1.5px solid var(--hair); font-size:13.5px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:8px;}
.list-tab.active{border-color:var(--accent); color:var(--accent); background:rgba(230,169,92,.08);}
.list-tab .del{opacity:.6;}
.new-list-btn{padding:9px 16px; border-radius:20px; border:1.5px dashed var(--hair); color:var(--muted); font-size:13.5px; font-weight:700; display:flex; gap:6px; align-items:center;}
.new-list-btn:hover{border-color:var(--accent); color:var(--accent);}

/* ---------- QUICK VIEW ---------- */
.quickview{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:520px; overflow:hidden; position:relative;}
.qv-media{height:230px; position:relative;}
.qv-body{padding:22px 24px 26px;}
.qv-title{font-size:22px; font-weight:800; margin-bottom:10px;}
.qv-meta{display:flex; gap:10px; color:var(--muted); font-size:13px; font-weight:600; margin-bottom:14px; flex-wrap:wrap;}
.qv-actions{display:flex; gap:10px; margin-bottom:16px;}
.qv-desc{color:#d8d2c8; font-size:13.5px; line-height:1.6;}

/* ---------- PLAYER ---------- */
#player-overlay{position:fixed; inset:0; background:#000; z-index:2000; display:flex; align-items:center; justify-content:center;}
#player-overlay video{width:100%; height:100%; object-fit:contain; background:#000;}
.player-ui{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; opacity:1; transition:opacity .3s var(--ease); pointer-events:none;}
.player-ui.hide-controls{opacity:0;}
.player-ui.hide-controls{cursor:none;}
.player-top{display:flex; justify-content:space-between; align-items:flex-start; padding:22px 26px; background:linear-gradient(0deg, transparent, rgba(0,0,0,.65)); pointer-events:auto;}
.player-top-title{font-weight:800; font-size:16px;}
.player-top-sub{color:var(--muted); font-size:12.5px; margin-top:2px;}
.player-center-controls{display:flex; align-items:center; justify-content:center; gap:34px; pointer-events:auto;}
.player-center-controls button{background:none; border:none; color:#fff; opacity:.95;}
.player-center-controls button:hover{opacity:1; transform:scale(1.08);}
.player-play-big{width:78px; height:78px; border-radius:50%; background:rgba(20,20,20,.45); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);}
.player-bottom{padding:10px 26px 22px; background:linear-gradient(0deg, rgba(0,0,0,.75), transparent); pointer-events:auto;}
.seek-wrap{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.seek-time{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; width:44px;}
.seek-bar{flex:1; position:relative; height:14px; display:flex; align-items:center; cursor:pointer;}
.seek-track{width:100%; height:4px; background:rgba(255,255,255,.25); border-radius:3px; position:relative; overflow:hidden;}
.seek-fill{position:absolute; inset-inline-start:0; top:0; bottom:0; background:var(--accent-grad); width:0%;}
.seek-buffer{position:absolute; inset-inline-start:0; top:0; bottom:0; background:rgba(255,255,255,.18); width:0%;}
.seek-handle{position:absolute; top:50%; width:13px; height:13px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); inset-inline-start:0%;}
.player-controls-row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
.pc-left,.pc-right{display:flex; align-items:center; gap:6px;}
.pc-btn{background:none; border:none; color:#fff; width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
.pc-btn:hover{background:rgba(255,255,255,.12);}
.pc-btn.big{width:44px; height:44px;}
.vol-wrap{display:flex; align-items:center; gap:6px;}
.vol-slider{width:70px; height:4px; background:rgba(255,255,255,.25); border-radius:3px; position:relative; cursor:pointer;}
.vol-fill{position:absolute; inset-inline-start:0; top:0; bottom:0; background:#fff; border-radius:3px; width:100%;}
@media (max-width:640px){.vol-wrap{display:none;}}
.settings-menu{position:absolute; bottom:64px; inset-inline-end:20px; background:rgba(20,18,16,.96); border:1px solid var(--hair); border-radius:10px; padding:8px; min-width:190px; backdrop-filter:blur(10px); pointer-events:auto;}
.settings-menu .sm-section{padding:6px 10px 4px; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
.settings-menu button{display:flex; width:100%; justify-content:space-between; background:none; border:none; color:#fff; padding:8px 10px; font-size:13.5px; border-radius:6px;}
.settings-menu button:hover{background:rgba(255,255,255,.08);}
.settings-menu button.sel{color:var(--accent);}
.next-ep-card{position:absolute; bottom:90px; inset-inline-end:26px; background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius); padding:16px; width:280px; pointer-events:auto; box-shadow:var(--shadow); animation:modalIn .3s var(--ease);}
.next-ep-card .thumb{aspect-ratio:16/9; border-radius:6px; margin-bottom:10px; position:relative; overflow:hidden;}
.next-ep-card b{font-size:13.5px; display:block; margin-bottom:4px;}
.next-ep-card .cd{color:var(--accent); font-size:12.5px; font-weight:700; margin-bottom:10px;}
.subtitle-cue{position:absolute; bottom:90px; inset-inline:0; text-align:center; pointer-events:none; z-index:5;}
.subtitle-cue span{background:rgba(0,0,0,.6); color:#fff; padding:6px 14px; border-radius:5px; font-size:16px; display:inline-block; max-width:80%;}
video::cue{background:rgba(0,0,0,.6); font-size:1.1em;}

.kbd-hint{position:absolute; bottom:20px; inset-inline-start:26px; color:rgba(255,255,255,.35); font-size:11px; pointer-events:none;}
@media (max-width:700px){.kbd-hint{display:none;}}

/* ---------- ADMIN ---------- */
.admin-wrap{padding:100px 32px 60px; max-width:900px; margin:0 auto;}
@media (max-width:600px){.admin-wrap{padding:88px 16px 60px;}}
.admin-tabs{display:flex; gap:8px; margin-bottom:26px; flex-wrap:wrap;}
.admin-tab{padding:9px 18px; border-radius:8px; background:var(--surface-2); border:1.5px solid var(--hair); color:var(--muted); font-weight:700; font-size:13.5px;}
.admin-tab.active{color:#1a1200; background:var(--accent-grad); border-color:transparent;}
.admin-card{background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius); padding:24px; margin-bottom:20px;}
.admin-card h3{margin:0 0 18px; font-size:16px;}
.content-list-item{display:flex; align-items:center; gap:14px; padding:12px; border-bottom:1px solid var(--hair);}
.content-list-item .mini-poster{width:44px; height:66px; border-radius:5px; flex:0 0 auto;}
.content-list-item .grow{flex:1; min-width:0;}
.content-list-item .grow b{display:block; font-size:14px;}
.content-list-item .grow span{color:var(--muted); font-size:12px;}
.content-list-item .row-actions{display:flex; gap:6px;}
.season-editor{border:1px dashed var(--hair); border-radius:10px; padding:16px; margin-bottom:14px;}
.ep-editor-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--hair);}
.ep-editor-row:first-of-type{border-top:none;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:24px;}
.stat-box{background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius); padding:18px;}
.stat-box b{font-family:'Bebas Neue',sans-serif; font-size:32px; display:block; color:var(--accent);}
.stat-box span{color:var(--muted); font-size:12.5px; font-weight:600;}
.help-box{background:rgba(230,169,92,.08); border:1px solid rgba(230,169,92,.3); border-radius:var(--radius); padding:16px 18px; font-size:13.5px; line-height:1.7; color:#e9dcc6; margin-bottom:22px;}
.help-box b{color:var(--accent);}

.toast{position:fixed; bottom:24px; inset-inline-start:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--hair); padding:12px 22px; border-radius:8px; z-index:5000; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); animation:toastIn .25s var(--ease);}
html[dir=rtl] .toast{transform:translateX(50%);}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)}}

.notif-panel{position:fixed; top:70px; inset-inline-end:24px; width:340px; max-width:90vw; background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius); box-shadow:var(--shadow); z-index:400; max-height:70vh; overflow:auto;}
.notif-panel .nh{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--hair); font-weight:700; font-size:14px;}
.notif-item{padding:14px 16px; border-bottom:1px solid var(--hair); font-size:13px; color:var(--muted);}
.notif-item.unread{background:rgba(230,169,92,.06); color:var(--text);}
.notif-item b{display:block; color:var(--text); margin-bottom:3px; font-size:13.5px;}

.skel{background:linear-gradient(100deg, var(--surface-2) 30%, var(--surface-3) 50%, var(--surface-2) 70%); background-size:200% 100%; animation:skel 1.4s ease-in-out infinite;}
@keyframes skel{to{background-position:-200% 0;}}
</style>

async function setRating(contentId, value, episodeKey){

  await savePData(); render();
}
function getRating(contentId, episodeKey){
  const key = episodeKey? contentId+"::"+episodeKey : contentId;
  return STATE.pdata.ratings[key] || 0;
}

/* continue watching */
async function updateProgress(contentId,type,season,episode,curTime,duration){
  if(!duration || duration<5) return;
  const pct = curTime/duration;
  let cw = STATE.pdata.continueWatching;
  const key = type==='series'? contentId+':'+season+':'+episode : contentId;
  let entry = cw.find(c=>c.key===key);
  if(pct>0.95){
    if(entry) cw = cw.filter(c=>c.key!==key);
    STATE.pdata.continueWatching = cw;
  } else {
    if(!entry){ entry = {key,contentId,type,season,episode,curTime,duration,ts:Date.now()}; cw.unshift(entry); }
    else { entry.curTime=curTime; entry.duration=duration; entry.ts=Date.now(); }
    STATE.pdata.continueWatching = cw.filter(c=>c.key===key || c!==entry).slice(0,20);
    STATE.pdata.continueWatching = cw;
  }
  await savePData();
}
function progressFor(contentId,type,season,episode){
  const key = type==='series'? contentId+':'+season+':'+episode : contentId;
  return STATE.pdata.continueWatching.find(c=>c.key===key);
}

function render(){
  document.documentElement.setAttribute('dir', STATE.lang==='ar'?'rtl':'ltr');
  document.documentElement.setAttribute('lang', STATE.lang);
  const app = document.getElementById('app');
  if(STATE.view==='loading'){ app.innerHTML=''; return; }
  if(STATE.view==='profileSelect'){ app.innerHTML = viewProfileSelect(); attachProfileSelectEvents(); return; }
  // all other views require profile
  let shellHtml = shell();
  app.innerHTML = shellHtml;
  attachShellEvents();
}

function viewProfileSelect(){
  const items = STATE.profiles.map(p=>`
    <div class="profile-item ${p.kids?'kids':''}" data-pid="${p.id}">
      <div class="avatar" style="background:${p.color}">${esc((p.name||'?').slice(0,1).toUpperCase())}</div>

  return `

    <div class="profile-grid">
      ${items}
      <div class="profile-item add" data-add="1"><div class="avatar">${ic('plus',30)}</div><span>${t('addProfile')}</span></div>
    </div>
    ${STATE.profiles.length? `<button class="manage-link" id="manageProfilesBtn">${t('manageProfiles')}</button>`:''}

}
function attachProfileSelectEvents(){
  document.querySelectorAll('.profile-item[data-pid]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const p = STATE.profiles.find(x=>x.id===el.dataset.pid);
      if(p.pin){ openPinModal(p); return; }
      await selectProfile(p.id);
    });
  });
  const addBtn = document.querySelector('.profile-item.add');
  if(addBtn) addBtn.addEventListener('click', ()=>openProfileForm(null));
  const manageBtn = document.getElementById('manageProfilesBtn');
  if(manageBtn) manageBtn.addEventListener('click', ()=>openManageProfiles());
}
async function selectProfile(pid){
  STATE.currentProfileId = pid;
  const p = STATE.profiles.find(x=>x.id===pid);
  STATE.lang = p.language || 'ar';
  let pdata = await sGet("profile-data:"+pid);
  if(!pdata){ pdata = defaultProfileData(); await sSet("profile-data:"+pid, pdata); }
  if(!pdata.lists) pdata.lists=[{id:"default",name:STATE.lang==='ar'?'قائمتي':'My List',isDefault:true,items:[]}];
  if(!pdata.notifications) pdata.notifications=[];
  STATE.pdata = pdata;
  STATE.view = 'home'; STATE.params={};
  render();
}

    case 'mylist': return viewMyList();
    case 'search': return viewSearch();

/* ---------------- shell events ---------------- */
function attachShellEvents(){
  const nb = document.getElementById('navbar');
  window.onscroll = ()=>{ if(!nb) return; nb.classList.toggle('scrolled', window.scrollY>10); };
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.preventDefault();
      const k = el.dataset.nav;
      if(k==='profileMenu'){ toggleProfileMenu(); return; }
      STATE.view = (k==='movies'||k==='series')? 'browse':k;
      STATE.params = (k==='movies'||k==='series')? {type:k}: {};
      window.scrollTo(0,0);
      render();
    });
  });
  const sb = document.getElementById('navSearchBtn'); if(sb) sb.onclick=()=>{ STATE.view='search'; STATE.params={}; render(); };
  const bb = document.getElementById('navBellBtn'); if(bb) bb.onclick=(e)=>{ e.stopPropagation(); toggleNotifPanel(); };
  const pmb = document.getElementById('profileMenuBtn'); if(pmb) pmb.onclick=(e)=>{ e.stopPropagation(); toggleProfileMenu(); };
  document.body.onclick=(e)=>{ closeFloatingPanels(e); };
  attachViewEvents();
}
function closeFloatingPanels(e){
  const np = document.getElementById('notifPanelEl');
  if(np && !np.contains(e.target) && e.target.id!=='navBellBtn') np.remove();
  const pm = document.getElementById('profileDropdownEl');
  if(pm && !pm.contains(e.target) && e.target.id!=='profileMenuBtn' && !e.target.closest('#profileMenuBtn')) pm.remove();
}
function toggleNotifPanel(){
  const ex = document.getElementById('notifPanelEl'); if(ex){ ex.remove(); return; }
  const notifs = STATE.pdata.notifications||[];
  const html = `<div class="notif-panel" id="notifPanelEl">
    <div class="nh"><span>${t('notifications')}</span><button class="btn-sm btn-ghost" id="notifClearAll" style="border:none; background:none; color:var(--accent); font-weight:700; font-size:12px;">${t('markAllRead')}</button></div>
    ${notifs.length? notifs.map(n=>`<div class="notif-item ${n.read?'':'unread'}"><b>${esc(STATE.lang==='ar'?n.titleAr:n.titleEn)}</b>${esc(STATE.lang==='ar'?n.bodyAr:n.bodyEn)}</div>`).join(''):
    `<div class="notif-item">${t('emptyListDesc')}</div>`}
  </div>`;
  document.getElementById('overlays').insertAdjacentHTML('beforeend', html);
  document.getElementById('notifClearAll').onclick=async (e)=>{ e.stopPropagation(); STATE.pdata.notifications.forEach(n=>n.read=true); await savePData(); render(); };
}
function toggleProfileMenu(){
  const ex = document.getElementById('profileDropdownEl'); if(ex){ ex.remove(); return; }
  const html = `<div id="profileDropdownEl" style="position:fixed; top:64px; inset-inline-end:24px; background:var(--surface); border:1px solid var(--hair); border-radius:10px; min-width:200px; z-index:400; box-shadow:var(--shadow); overflow:hidden;">
    <div style="padding:10px 0;">
      <a href="#" data-menu="switch" style="display:block; padding:11px 18px; font-size:13.5px; font-weight:600;">${t('switchProfile')}</a>
      <a href="#" data-menu="settings" style="display:block; padding:11px 18px; font-size:13.5px; font-weight:600;">${t('settings')}</a>
      <a href="#" data-menu="history" style="display:block; padding:11px 18px; font-size:13.5px; font-weight:600;">${t('history')||(STATE.lang==='ar'?'سجل المشاهدة':'Viewing History')}</a>
      <a href="#" data-menu="admin" style="display:block; padding:11px 18px; font-size:13.5px; font-weight:600; color:var(--accent);">${t('manageContent')}</a>
    </div>
  </div>`;
  document.getElementById('overlays').insertAdjacentHTML('beforeend', html);
  document.querySelectorAll('[data-menu]').forEach(a=>a.onclick=(e)=>{
    e.preventDefault();
    const m = a.dataset.menu;
    document.getElementById('profileDropdownEl').remove();
    if(m==='switch'){ STATE.currentProfileId=null; STATE.view='profileSelect'; render(); }

  });

/* ================= CARD / ROW COMPONENTS ================= */
function progressPct(x){
  if(x.type==='movie'){ const c=progressFor(x.id,'movie'); if(!c) return 0; return Math.min(100, Math.round((c.curTime/c.duration)*100)); }
  else{ const cw = STATE.pdata.continueWatching.filter(c=>c.contentId===x.id); if(!cw.length) return 0; const c=cw.sort((a,b)=>b.ts-a.ts)[0]; return Math.min(100, Math.round((c.curTime/c.duration)*100)); }
}
function cardHtml(x){
  const inList = inDefaultList(x.id);
  const like = STATE.pdata.likes[x.id];
  const pct = progressPct(x);
  let sub = '';
  if(x.type==='series'){
    const cw = STATE.pdata.continueWatching.filter(c=>c.contentId===x.id).sort((a,b)=>b.ts-a.ts)[0];
    if(cw) sub = `${t('s')}${cw.season} ${t('e')}${cw.episode}`;
  }
  return `<div class="card" data-open="${x.id}" data-type="${x.type}">
    <div class="card-poster" style="background:${gradFor(x.id)}"><span class="ptitle">${esc(tTitle(x))}</span></div>
    ${x.score? `<div class="card-badge">★ ${x.score}</div>`:''}
    <div class="card-hover">
      <div class="card-hover-title">${esc(tTitle(x))}${sub?` <span style="color:var(--muted); font-weight:500;">· ${sub}</span>`:''}</div>
      <div class="card-hover-meta"><span>${x.year||''}</span><span class="dot" style="width:3px;height:3px;background:var(--dim);border-radius:50%;"></span><span>${esc((x.genres||[]).slice(0,2).join(', '))}</span></div>
      <div class="card-hover-actions">
        <button class="primary" data-play="${x.id}" data-type="${x.type}" title="${t('play')}">${ic('play',14)}</button>
        <button data-toggle-list="${x.id}" title="${t('addToList')}">${inList?ic('check',14):ic('plus',14)}</button>
        <button class="${like===1?'active':''}" data-like="${x.id}" title="${t('like')}">${ic('thumbUp',13)}</button>
        <button data-info="${x.id}" data-type="${x.type}" title="${t('moreInfo')}">${ic('info',14)}</button>
      </div>
    </div>
    ${pct>0? `<div class="card-progress"><i style="width:${pct}%"></i></div>`:''}
  </div>`;
}
function rowHtml(title, items, rowId){
  if(!items.length) return '';
  return `<div class="row-block">
    <div class="row-head"><div class="row-title">${esc(title)}</div></div>
    <div class="row-viewport">
      <button class="row-arrow start" data-scroll="${rowId}:-1">${ic('chevLeft')}</button>

      <button class="row-arrow end" data-scroll="${rowId}:1">${ic('chevRight')}</button>

/* ================= SEARCH ================= */
function normalizeQuery(q){ return (q||'').trim().toLowerCase(); }
const AR_EN_ALIASES = [
  {ar:["سبايدر مان","سبايدرمان"], en:"spider"}, {ar:["الأرنب","ارنب"], en:"bunny"},
  {ar:["حلم الأفيال","الافيال"], en:"elephant"}, {ar:["سينتل"], en:"sintel"},
  {ar:["الفولاذ","فولاذ"], en:"steel"}, {ar:["اكشن"], en:"action"}, {ar:["كوميدي","كوميديا"], en:"comedy"},
  {ar:["دراما"], en:"drama"}, {ar:["رعب"], en:"horror"}, {ar:["خيال علمي"], en:"sci-fi"},
];
function searchMatches(x, q){
  if(!q) return true;
  const hay = [x.titleAr,x.titleEn,x.originalTitle, ...(x.genres||[]), ...(x.cast||[]), x.director||x.creator||''].join(' ').toLowerCase();
  if(hay.includes(q)) return true;
  for(const a of AR_EN_ALIASES){
    if(a.ar.some(w=>q.includes(w.toLowerCase())) && hay.includes(a.en)) return true;
    if(q.includes(a.en) && a.ar.some(w=>hay.includes(w))) return true;
  }
  return false;
}
function viewSearch(){
  const q = STATE.params.q || '';
  const all = allTitles();
  const results = q? all.filter(x=>searchMatches(x, normalizeQuery(q))) : [];
  return `<div class="search-page">
    <div class="search-box">${ic('search')}<input type="text" id="searchInput" placeholder="${t('searchPlaceholder')}" value="${esc(q)}" autofocus></div>
    ${q? (results.length? `<div class="grid" style="padding:0;">${results.map(cardHtml).join('')}</div>` : emptyState(t('noResultsTitle'), t('noResultsDesc')))
       : `<div class="chip-row" style="padding:0;">${["Action","Comedy","Drama","Sci-Fi","Animation"].map(c=>`<div class="chip" data-quicksearch="${c}">${c}</div>`).join('')}</div>`}
  </div>`;
}

      <div><b>${t('quality')}</b>${(x.quality||['Auto','1080p']).join(', ')}</div>
    </div>
    <div class="rating-block">

      ${starsHtml(rating, (v)=>`setRating('${x.id}',${v})`)}
      <div class="your-rating-note">${t('yourRating')}: ${rating||'-'}/5</div>
    </div>
    ${related.length? `<div class="section-heading">${t('moreLikeThis')}</div><div class="grid" style="padding:0 0 20px;">${related.map(cardHtml).join('')}</div>`:''}
  </div>`;
}
function starsHtml(value, fnStr, small){
  const size = small? 15: 22;
  let out = '<span class="stars">';
  for(let i=1;i<=5;i++){
    out += `<button class="${i<=value?'filled':''}" onclick="${fnStr(i)}; event.stopPropagation();">${ICON.star.replace(/width="\d+"/,'width="'+size+'"').replace(/height="\d+"/,'height="'+size+'"')}</button>`;
  }
  return out+'</span>';
}

/* ================= EVENTS FOR VIEWS ================= */
function attachViewEvents(){
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('button')) return;
    openTitle(el.dataset.open, el.dataset.type);
  }));
  document.querySelectorAll('[data-info]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); openQuickView(el.dataset.info); }));
  document.querySelectorAll('[data-play]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    openPlayer(el.dataset.id||el.closest('[data-play]').dataset.play || el.dataset.play, el.dataset.type, el.dataset.season?parseInt(el.dataset.season):null, el.dataset.episode?parseInt(el.dataset.episode):null);
  }));
  document.querySelectorAll('[data-toggle-list]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); toggleMyList(el.dataset.toggleList); }));
  document.querySelectorAll('[data-like]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); setLike(el.dataset.like,1); }));
  document.querySelectorAll('[data-dislike]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); setLike(el.dataset.dislike,-1); }));
  document.querySelectorAll('[data-scroll]').forEach(el=>el.addEventListener('click',()=>{
    const [id,dir] = el.dataset.scroll.split(':'); const track=document.getElementById(id);
    if(track) track.scrollBy({left: parseInt(dir)*600*(document.documentElement.dir==='rtl'?-1:1), behavior:'smooth'});
  }));
  document.querySelectorAll('[data-catfilter]').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('[data-catfilter]').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    STATE.params.cat = el.dataset.catfilter;
    const r = document.getElementById('catResults'); if(r) r.innerHTML = categoryResults(el.dataset.catfilter);
    attachViewEvents();
  }));
  const si = document.getElementById('searchInput');
  if(si){ si.addEventListener('input', ()=>{ STATE.params.q = si.value; renderInto(); si.focus(); si.setSelectionRange(si.value.length, si.value.length); }); }
  document.querySelectorAll('[data-quicksearch]').forEach(el=>el.addEventListener('click',()=>{ STATE.params.q = el.dataset.quicksearch; render(); const s=document.getElementById('searchInput'); if(s) s.focus(); }));
  const ss = document.getElementById('seasonSelect'); if(ss) ss.addEventListener('change', ()=>{ STATE.params.season = parseInt(ss.value); render(); });
  document.querySelectorAll('[data-listtab]').forEach(el=>el.addEventListener('click',(e)=>{ if(e.target.closest('[data-dellist]')) return; STATE.params.listId = el.dataset.listtab; render(); }));
  document.querySelectorAll('[data-dellist]').forEach(el=>el.addEventListener('click', async (e)=>{ e.stopPropagation(); STATE.pdata.lists = STATE.pdata.lists.filter(l=>l.id!==el.dataset.dellist); STATE.params.listId='default'; await savePData(); render(); }));
  const nlb = document.getElementById('newListBtn'); if(nlb) nlb.addEventListener('click', ()=>openNewListModal());
  const la = document.getElementById('langAr'); if(la) la.onclick=()=>switchLang('ar');
  const le = document.getElementById('langEn'); if(le) le.onclick=()=>switchLang('en');
  attachAdminEvents();
}
function renderInto(){ document.getElementById('pageContent').innerHTML = renderView(); attachViewEvents(); }
async function switchLang(l){
  STATE.lang = l;
  const dl = STATE.pdata.lists.find(x=>x.isDefault); if(dl && (dl.name==='My List'||dl.name==='قائمتي')) dl.name = l==='ar'?'قائمتي':'My List';

/* ================= VIDEO PLAYER ================= */
let PLAYER = { hideTimer:null, contentId:null, type:null, season:null, episode:null, saveTimer:null, nextEpTimeout:null };
function openPlayer(id,type,season,episode){
  const x = findTitle(id); if(!x) return;
  let vid, subs, epMeta=null, seasonObj=null;
  if(type==='movie'){ vid = x.video; }
  else{
    seasonObj = (x.seasons||[]).find(s=>s.number==season) || x.seasons[0];
    season = seasonObj.number;
    epMeta = seasonObj.episodes.find(e=>e.number==episode) || seasonObj.episodes[0];
    episode = epMeta.number;
    vid = epMeta.video;
  }
  PLAYER.contentId=id; PLAYER.type=type; PLAYER.season=season; PLAYER.episode=episode;
  const resumed = progressFor(id,type,season,episode);
  const overlay = document.createElement('div'); overlay.id='player-overlay';
  const subOptions = (vid.subtitles||[]).map(s=>`<button data-sub="${s.lang}">${s.label}<span class="cur-mark"></span></button>`).join('');
  overlay.innerHTML = `
    <video id="ply-video" playsinline ${resumed? '':'autoplay'}>
      <source src="${vid.src}" type="video/mp4">
      ${(vid.subtitles||[]).map(s=>`<track kind="subtitles" srclang="${s.lang}" label="${s.label}" src="${s.src}">`).join('')}
    </video>
    <div class="player-ui" id="playerUI">
      <div class="player-top">
        <div>
          <div class="player-top-title">${esc(tTitle(x))}</div>
          <div class="player-top-sub">${type==='series'? `${t('s')}${season} ${t('e')}${episode} · ${esc(STATE.lang==='ar'?epMeta.titleAr:epMeta.titleEn)}`:''}</div>
        </div>
        <button class="btn-icon" id="plyClose">${ic('x')}</button>
      </div>
      <div class="player-center-controls">
        <button id="plyPrev" title="${t('prev')||''}" style="${type==='series'?'':'display:none;'}">${ic('prev',26)}</button>
        <button id="plySkipBack">${ic('back10',30)}</button>
        <button class="player-play-big" id="plyPlayBig">${ic('pause',26)}</button>
        <button id="plySkipFwd">${ic('fwd10',30)}</button>
        <button id="plyNext" title="${t('next')||''}" style="${type==='series'?'':'display:none;'}">${ic('next',26)}</button>
      </div>
      <div class="player-bottom">
        <div class="seek-wrap">
          <span class="seek-time" id="plyCur">0:00</span>
          <div class="seek-bar" id="seekBar"><div class="seek-track"><div class="seek-buffer" id="seekBuffer"></div><div class="seek-fill" id="seekFill"></div><div class="seek-handle" id="seekHandle"></div></div></div>
          <span class="seek-time" id="plyDur">0:00</span>
        </div>
        <div class="player-controls-row">
          <div class="pc-left">
            <button class="pc-btn" id="plyPlay">${ic('pause')}</button>
            <div class="vol-wrap"><button class="pc-btn" id="plyMute">${ic('volume')}</button><div class="vol-slider" id="volSlider"><div class="vol-fill" id="volFill"></div></div></div>
          </div>
          <div class="pc-right">
            <button class="pc-btn" id="plyCC" title="${t('subtitles')}">${ic('cc')}</button>
            <button class="pc-btn" id="plySettings">${ic('gear')}</button>
            <button class="pc-btn" id="plyPip">${ic('pip')}</button>
            <button class="pc-btn" id="plyFs">${ic('fullscreen')}</button>
          </div>
        </div>
      </div>
      <div class="kbd-hint">${STATE.lang==='ar'?'مسافة تشغيل/إيقاف · الأسهم تقديم/رجوع · f ملء الشاشة · m كتم':'space play/pause · arrows seek · f fullscreen · m mute'}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  const video = document.getElementById('ply-video');
  video.volume = 1;
  let subtitlesOn = true; let curSubLang = (vid.subtitles&&vid.subtitles[0])? vid.subtitles[0].lang: null;

  if(resumed && resumed.curTime>2){
    video.addEventListener('loadedmetadata', ()=>{ video.currentTime = resumed.curTime; video.play(); }, {once:true});
  }

  function fmt(sec){ return fmtTime(sec); }
  function updateSeek(){
    const cur = video.currentTime||0, dur = video.duration||0;
    document.getElementById('plyCur').textContent = fmt(cur);
    document.getElementById('plyDur').textContent = fmt(dur);
    const pct = dur? (cur/dur*100):0;
    document.getElementById('seekFill').style.width = pct+'%';
    document.getElementById('seekHandle').style[document.documentElement.dir==='rtl'?'insetInlineStart':'insetInlineStart'] = pct+'%';
    if(video.buffered && video.buffered.length){ const b = video.buffered.end(video.buffered.length-1); document.getElementById('seekBuffer').style.width = (dur? b/dur*100:0)+'%'; }
  }
  video.addEventListener('timeupdate', ()=>{
    updateSeek();
    if(!PLAYER.saveTimer){ PLAYER.saveTimer = setTimeout(()=>{ PLAYER.saveTimer=null; }, 4000); updateProgress(id,type,season,episode, video.currentTime, video.duration); }
  });
  video.addEventListener('play', ()=>{ setPlayIcon(true); });
  video.addEventListener('pause', ()=>{ setPlayIcon(false); });
  function setPlayIcon(playing){
    document.getElementById('plyPlay').innerHTML = playing? ic('pause').replace('icon','') : ic('play').replace('icon','');
    document.getElementById('plyPlay').innerHTML = playing? ICON.pause : ICON.play;
    document.getElementById('plyPlayBig').innerHTML = playing? ICON.pause.replace(/width="\d+"/,'width="26"').replace(/height="\d+"/,'height="26"') : ICON.playBig;
  }
  document.getElementById('plyPlay').onclick = ()=> video.paused? video.play(): video.pause();
  document.getElementById('plyPlayBig').onclick = ()=> video.paused? video.play(): video.pause();
  document.getElementById('plySkipBack').onclick = ()=>{ video.currentTime = Math.max(0, video.currentTime-10); };
  document.getElementById('plySkipFwd').onclick = ()=>{ video.currentTime = Math.min(video.duration, video.currentTime+10); };
  document.getElementById('plyClose').onclick = ()=> closePlayer();

  const seekBar = document.getElementById('seekBar');
  function seekTo(e){
    const rect = seekBar.getBoundingClientRect();
    let ratio = (e.clientX - rect.left)/rect.width;
    if(document.documentElement.dir==='rtl') ratio = 1-ratio;
    ratio = Math.min(1,Math.max(0,ratio));
    video.currentTime = ratio*(video.duration||0);
  }
  seekBar.addEventListener('click', seekTo);

  const volSlider = document.getElementById('volSlider'), volFill = document.getElementById('volFill');
  function setVol(v){ video.volume=v; volFill.style.width=(v*100)+'%'; document.getElementById('plyMute').innerHTML = v===0? ICON.mute: ICON.volume; }
  volSlider.addEventListener('click',(e)=>{ const r=volSlider.getBoundingClientRect(); let ratio=(e.clientX-r.left)/r.width; if(document.documentElement.dir==='rtl') ratio=1-ratio; setVol(Math.min(1,Math.max(0,ratio))); });
  document.getElementById('plyMute').onclick = ()=>{ setVol(video.volume>0?0:1); };

  document.getElementById('plyFs').onclick = ()=>{ if(!document.fullscreenElement) overlay.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); };
  document.getElementById('plyPip').onclick = async ()=>{ try{ if(document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); }catch(e){} };

  document.getElementById('plyCC').onclick = ()=>{
    subtitlesOn = !subtitlesOn;
    for(const tr of video.textTracks){ tr.mode = (subtitlesOn && tr.language===curSubLang)? 'showing':'disabled'; }
    toast(subtitlesOn? (STATE.lang==='ar'?'الترجمة مفعلة':'Subtitles on') : (STATE.lang==='ar'?'الترجمة متوقفة':'Subtitles off'));
  };
  for(const tr of video.textTracks){ tr.mode = (tr.language===curSubLang)?'showing':'disabled'; }

  let settingsOpen=false;
  document.getElementById('plySettings').onclick = (e)=>{
    e.stopPropagation();
    if(settingsOpen){ document.getElementById('plySettingsMenu').remove(); settingsOpen=false; return; }
    settingsOpen=true;
    const speeds=[0.5,0.75,1,1.25,1.5,2];
    const menu = document.createElement('div'); menu.className='settings-menu'; menu.id='plySettingsMenu';
    menu.innerHTML = `
      <div class="sm-section">${t('playbackSpeed')}</div>
      ${speeds.map(s=>`<button data-speed="${s}" class="${video.playbackRate===s?'sel':''}">${s}x ${video.playbackRate===s?ic('check',12):''}</button>`).join('')}
      <div class="sm-section">${t('quality')}</div>
      ${(x.quality||['Auto']).map((q,i)=>`<button data-quality="${q}" class="${i===0?'sel':''}">${q} ${i===0?ic('check',12):''}</button>`).join('')}
      <div class="sm-section">${t('subtitles')}</div>
      <button data-sublang="off" class="${!subtitlesOn?'sel':''}">${STATE.lang==='ar'?'إيقاف':'Off'} ${!subtitlesOn?ic('check',12):''}</button>
      ${(vid.subtitles||[]).map(s=>`<button data-sublang="${s.lang}" class="${subtitlesOn && curSubLang===s.lang?'sel':''}">${s.label} ${subtitlesOn && curSubLang===s.lang?ic('check',12):''}</button>`).join('')}
    `;
    document.getElementById('playerUI').appendChild(menu);
    menu.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{ video.playbackRate=parseFloat(b.dataset.speed); menu.remove(); settingsOpen=false; });
    menu.querySelectorAll('[data-quality]').forEach(b=>b.onclick=()=>{ toast((STATE.lang==='ar'?'الجودة: ':'Quality: ')+b.dataset.quality); menu.remove(); settingsOpen=false; });
    menu.querySelectorAll('[data-sublang]').forEach(b=>b.onclick=()=>{
      if(b.dataset.sublang==='off'){ subtitlesOn=false; } else { subtitlesOn=true; curSubLang=b.dataset.sublang; }
      for(const tr of video.textTracks){ tr.mode = (subtitlesOn && tr.language===curSubLang)?'showing':'disabled'; }
      menu.remove(); settingsOpen=false;
    });
  };

  // next/prev episode
  function seriesNav(dir){
    if(type!=='series') return;
    const epsIdx = seasonObj.episodes.findIndex(e=>e.number===episode);
    let ni = epsIdx+dir;
    if(ni>=0 && ni<seasonObj.episodes.length){ closePlayer(); openPlayer(id,'series',season, seasonObj.episodes[ni].number); }
  }
  document.getElementById('plyNext').onclick = ()=>seriesNav(1);
  document.getElementById('plyPrev').onclick = ()=>seriesNav(-1);

  // autoplay next w/ countdown
  video.addEventListener('ended', ()=>{
    updateProgress(id,type,season,episode, video.duration, video.duration);
    if(type==='series'){
      const epsIdx = seasonObj.episodes.findIndex(e=>e.number===episode);
      const nextEp = seasonObj.episodes[epsIdx+1];
      if(nextEp) showNextEpisodeCard(nextEp);
    }
  });
  function showNextEpisodeCard(nextEp){
    let secs=5;
    const card = document.createElement('div'); card.className='next-ep-card'; card.id='nextEpCard';
    function draw(){
      card.innerHTML = `<div class="thumb" style="background:${gradFor(id+nextEp.number)}"></div>
      <b>${t('s')}${season} ${t('e')}${nextEp.number} · ${esc(STATE.lang==='ar'?nextEp.titleAr:nextEp.titleEn)}</b>
      <div class="cd">${t('nextEpisodeIn')} ${secs}…</div>
      <div style="display:flex; gap:8px;"><button class="btn btn-primary btn-sm" id="nextPlayNow">${t('playNow')}</button><button class="btn btn-outline btn-sm" id="nextCancel">${t('cancel')}</button></div>`;
      document.getElementById('nextPlayNow').onclick=()=>{ clearInterval(iv); closePlayer(); openPlayer(id,'series',season,nextEp.number); };
      document.getElementById('nextCancel').onclick=()=>{ clearInterval(iv); card.remove(); };
    }
    document.getElementById('playerUI').appendChild(card); draw();
    const iv = setInterval(()=>{ secs--; if(secs<=0){ clearInterval(iv); closePlayer(); openPlayer(id,'series',season,nextEp.number); } else draw(); }, 1000);
    PLAYER.nextEpTimeout = iv;
  }

  // hide controls on inactivity (desktop) / tap toggle (mobile)
  const ui = document.getElementById('playerUI');
  function resetHide(){
    ui.classList.remove('hide-controls');
    clearTimeout(PLAYER.hideTimer);
    if(!video.paused) PLAYER.hideTimer = setTimeout(()=>ui.classList.add('hide-controls'), 3000);
  }
  overlay.addEventListener('mousemove', resetHide);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay || e.target.id==='ply-video'){ if(ui.classList.contains('hide-controls')) resetHide(); else ui.classList.toggle('hide-controls'); } });
  resetHide();

  // keyboard shortcuts
  function keyHandler(e){
    if(e.code==='Space'){ e.preventDefault(); video.paused? video.play(): video.pause(); }
    else if(e.code==='ArrowRight'){ video.currentTime = Math.min(video.duration, video.currentTime + (document.documentElement.dir==='rtl'?-10:10)); }
    else if(e.code==='ArrowLeft'){ video.currentTime = Math.max(0, video.currentTime - (document.documentElement.dir==='rtl'?-10:10)); }
    else if(e.key==='f'){ document.getElementById('plyFs').click(); }
    else if(e.key==='m'){ document.getElementById('plyMute').click(); }
    else if(e.key==='Escape'){ closePlayer(); }
  }
  document.addEventListener('keydown', keyHandler);
  overlay._keyHandler = keyHandler;
  setVol(1);
}
function closePlayer(){
  const overlay = document.getElementById('player-overlay'); if(!overlay) return;
  const video = document.getElementById('ply-video');
  if(video && PLAYER.contentId){ updateProgress(PLAYER.contentId, PLAYER.type, PLAYER.season, PLAYER.episode, video.currentTime, video.duration||video.currentTime||1); }
  if(overlay._keyHandler) document.removeEventListener('keydown', overlay._keyHandler);
  clearInterval(PLAYER.nextEpTimeout);
  overlay.remove();
  render();
}

/* ================= ADMIN ================= */
function viewAdmin(){
  const tab = STATE.params.tab || 'dashboard';
  const tabs = [['dashboard',t('dashboard')],['movies',t('manageMovies')],['series',t('manageSeries')]];
  return `<div class="admin-wrap">
    <div class="page-title" style="margin-bottom:6px;">${t('manageContent')}</div>
    <div class="help-box">${t('contentManagerHelp')}</div>
    <div class="admin-tabs">${tabs.map(([k,l])=>`<div class="admin-tab ${tab===k?'active':''}" data-admintab="${k}">${l}</div>`).join('')}</div>
    <div id="adminBody">${adminBody(tab)}</div>
  </div>`;
}
function adminBody(tab){
  if(tab==='dashboard') return adminDashboard();
  if(tab==='movies') return adminMovies();
  if(tab==='series') return adminSeries();
  return '';
}
function adminDashboard(){
  const movies = STATE.content.movies.length, series = STATE.content.series.length;
  const totalSeasons = STATE.content.series.reduce((a,s)=>a+(s.seasons||[]).length,0);
  const totalEpisodes = STATE.content.series.reduce((a,s)=>a+(s.seasons||[]).reduce((b,se)=>b+se.episodes.length,0),0);
  const mostWatched = [...allTitles()].sort((a,b)=>(b.score||0)-(a.score||0))[0];
  return `<div class="stat-grid">
    <div class="stat-box"><b>${movies}</b><span>${t('totalMovies')}</span></div>
    <div class="stat-box"><b>${series}</b><span>${t('totalSeries')}</span></div>
    <div class="stat-box"><b>${totalSeasons}</b><span>${t('season')}</span></div>
    <div class="stat-box"><b>${totalEpisodes}</b><span>${t('totalEpisodes')}</span></div>
    <div class="stat-box"><b style="font-size:16px;">${mostWatched?esc(tTitle(mostWatched)):'-'}</b><span>${t('mostWatched')}</span></div>
  </div>`;
}
function adminMovies(){
  const items = STATE.content.movies;
  return `<div class="admin-card">
    <h3>${t('addMovie')}</h3>
    ${movieForm()}
  </div>
  <div class="admin-card"><h3>${t('manageMovies')} (${items.length})</h3>
    ${items.map(m=>`<div class="content-list-item">
      <div class="mini-poster" style="background:${gradFor(m.id)}"></div>
      <div class="grow"><b>${esc(m.titleEn)} / ${esc(m.titleAr)}</b><span>${m.year} · ${esc((m.genres||[]).join(', '))}</span></div>
      <div class="row-actions">
        <button class="btn-icon" data-editmovie="${m.id}">${ic('editIcon',14)}</button>
        <button class="btn-icon" data-delmovie="${m.id}" style="color:var(--danger);">${ic('trash',14)}</button>
      </div>
    </div>`).join('')}
  </div>`;
}
function movieForm(existing){
  const m = existing || {};
  return `<form id="movieForm" data-editing="${existing?existing.id:''}">
    <div class="field-row"><div class="field"><label>${t('titleAr')}</label><input type="text" name="titleAr" value="${esc(m.titleAr||'')}" required></div>
    <div class="field"><label>${t('titleEn')}</label><input type="text" name="titleEn" value="${esc(m.titleEn||'')}" required></div></div>
    <div class="field"><label>${t('description')}</label><textarea name="descAr" placeholder="${t('titleAr')}">${esc(m.descAr||'')}</textarea></div>
    <div class="field"><textarea name="descEn" placeholder="${t('titleEn')}">${esc(m.descEn||'')}</textarea></div>
    <div class="field-row">
      <div class="field"><label>${t('year')}</label><input type="number" name="year" value="${m.year||new Date().getFullYear()}"></div>
      <div class="field"><label>${t('runtime')} (${STATE.lang==='ar'?'د':'min'})</label><input type="number" name="runtime" value="${m.runtime||90}"></div>
      <div class="field"><label>${t('ageRatingField')}</label><input type="text" name="ageRating" value="${esc(m.ageRating||'PG-13')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${t('genresField')}</label><input type="text" name="genres" value="${esc((m.genres||[]).join(', '))}" placeholder="Action, Drama"></div>
      <div class="field"><label>${t('countryField')}</label><input type="text" name="country" value="${esc(m.country||'')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${t('castField')}</label><input type="text" name="cast" value="${esc((m.cast||[]).join(', '))}"></div>
      <div class="field"><label>${t('directorField')}</label><input type="text" name="director" value="${esc(m.director||'')}"></div>
    </div>
    <div class="field"><label>${t('videoUrl')}</label><input type="url" name="video" value="${esc(m.video?m.video.src:'')}" placeholder="https://.../movie.mp4" required></div>
    <button type="submit" class="btn btn-primary">${existing? t('update'): t('addTitle')}</button>
  </form>`;
}
function adminSeries(){
  const items = STATE.content.series;
  return `<div class="admin-card"><h3>${t('addSeries')}</h3>${seriesForm()}</div>
  <div class="admin-card"><h3>${t('manageSeries')} (${items.length})</h3>
    ${items.map(s=>`<div class="content-list-item">
      <div class="mini-poster" style="background:${gradFor(s.id)}"></div>
      <div class="grow"><b>${esc(s.titleEn)} / ${esc(s.titleAr)}</b><span>${(s.seasons||[]).length} ${STATE.lang==='ar'?'مواسم':'seasons'}</span></div>
      <div class="row-actions">
        <button class="btn btn-sm btn-outline" data-manageeps="${s.id}">${t('episodes')}</button>
        <button class="btn-icon" data-delseries="${s.id}" style="color:var(--danger);">${ic('trash',14)}</button>
      </div>
    </div>`).join('')}
  </div>
  ${STATE.params.manageSeriesId? seriesEpisodeManager(STATE.params.manageSeriesId): ''}`;
}
function seriesForm(){
  return `<form id="seriesForm">
    <div class="field-row"><div class="field"><label>${t('titleAr')}</label><input type="text" name="titleAr" required></div>
    <div class="field"><label>${t('titleEn')}</label><input type="text" name="titleEn" required></div></div>
    <div class="field"><textarea name="descAr" placeholder="${t('titleAr')} - ${t('description')}"></textarea></div>
    <div class="field"><textarea name="descEn" placeholder="${t('titleEn')} - ${t('description')}"></textarea></div>
    <div class="field-row">
      <div class="field"><label>${t('year')}</label><input type="number" name="year" value="${new Date().getFullYear()}"></div>
      <div class="field"><label>${t('ageRatingField')}</label><input type="text" name="ageRating" value="PG-13"></div>
      <div class="field"><label>${t('genresField')}</label><input type="text" name="genres" placeholder="Drama, Thriller"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${t('castField')}</label><input type="text" name="cast"></div>
      <div class="field"><label>${t('directorField')}</label><input type="text" name="creator"></div>
    </div>
    <button type="submit" class="btn btn-primary">${t('addSeries')}</button>
  </form>`;
}
function seriesEpisodeManager(seriesId){
  const s = STATE.content.series.find(x=>x.id===seriesId); if(!s) return '';
  return `<div class="admin-card"><h3>${esc(s.titleEn)} — ${t('episodes')}</h3>
    ${(s.seasons||[]).map(se=>`<div class="season-editor">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;"><b>${t('season')} ${se.number}</b></div>
      ${se.episodes.map(ep=>`<div class="ep-editor-row"><div class="mini-poster" style="width:56px;height:32px;background:${gradFor(s.id+ep.number)}"></div>
        <div class="grow"><b>${ep.number}. ${esc(STATE.lang==='ar'?ep.titleAr:ep.titleEn)}</b><span>${ep.runtime} min</span></div>
        <button class="btn-icon" data-delep="${s.id}:${se.number}:${ep.number}" style="color:var(--danger);">${ic('trash',13)}</button>
      </div>`).join('') || `<div style="color:var(--muted); font-size:13px;">${t('noEpisodesYet')}</div>`}
      <details style="margin-top:10px;"><summary style="cursor:pointer; color:var(--accent); font-size:13px; font-weight:700;">${t('addEpisode')}</summary>
        <form class="epForm" data-season="${se.number}" data-series="${s.id}" style="margin-top:12px;">
          <div class="field-row"><div class="field"><label>${t('episodeTitle')} (AR)</label><input type="text" name="titleAr" required></div><div class="field"><label>${t('episodeTitle')} (EN)</label><input type="text" name="titleEn" required></div></div>
          <div class="field"><textarea name="descAr" placeholder="${t('episodeDesc')} (AR)"></textarea></div>
          <div class="field"><textarea name="descEn" placeholder="${t('episodeDesc')} (EN)"></textarea></div>
          <div class="field-row"><div class="field"><label>${t('runtime')}</label><input type="number" name="runtime" value="20"></div>
          <div class="field"><label>${t('videoUrl')}</label><input type="url" name="video" required></div></div>
          <button type="submit" class="btn btn-primary btn-sm">${t('addEpisode')}</button>
        </form>
      </details>
    </div>`).join('')}
    <form id="newSeasonForm" data-series="${s.id}" style="display:flex; gap:10px; align-items:flex-end;">
      <div class="field" style="flex:1; margin:0;"><label>${t('newSeason')}</label><input type="number" name="num" value="${(s.seasons||[]).length+1}"></div>
      <button type="submit" class="btn btn-outline btn-sm">${t('addSeason')}</button>
    </form>
  </div>`;
}
function attachAdminEvents(){
  document.querySelectorAll('[data-admintab]').forEach(el=>el.addEventListener('click',()=>{ STATE.params.tab = el.dataset.admintab; STATE.params.manageSeriesId=null; render(); }));
  const mf = document.getElementById('movieForm');
  if(mf) mf.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(mf);
    const editingId = mf.dataset.editing;
    const obj = {
      id: editingId || uid('m'),
      titleAr: fd.get('titleAr'), titleEn: fd.get('titleEn'), originalTitle: fd.get('titleEn'),
      descAr: fd.get('descAr'), descEn: fd.get('descEn'),
      year: parseInt(fd.get('year'))||new Date().getFullYear(), runtime: parseInt(fd.get('runtime'))||90,
      ageRating: fd.get('ageRating'), score: (editingId && STATE.content.movies.find(x=>x.id===editingId)?.score) || (7+Math.random()*2).toFixed(1)*1,
      genres: fd.get('genres').split(',').map(s=>s.trim()).filter(Boolean),
      country: fd.get('country'), cast: fd.get('cast').split(',').map(s=>s.trim()).filter(Boolean),
      director: fd.get('director'),
      video:{ src: fd.get('video'), subtitles:[{lang:'ar',label:'العربية',src:SUB_AR},{lang:'en',label:'English',src:SUB_EN}], audio:[{lang:'en',label:'English'}] },
      quality:['Auto','1080p','720p'],
    };
    if(editingId) STATE.content.movies = STATE.content.movies.map(x=>x.id===editingId?obj:x);
    else STATE.content.movies.push(obj);
    await saveContentGlobal();
    toast(editingId? (STATE.lang==='ar'?'تم التحديث':'Updated') : (STATE.lang==='ar'?'تمت الإضافة':'Added'));
    STATE.params={tab:'movies'}; render();
  });
  document.querySelectorAll('[data-editmovie]').forEach(b=>b.addEventListener('click',()=>{
    const m = STATE.content.movies.find(x=>x.id===b.dataset.editmovie);
    document.getElementById('adminBody').innerHTML = `<div class="admin-card"><h3>${t('edit')}</h3>${movieForm(m)}</div>` + adminMovies();
    attachAdminEvents();
  }));
  document.querySelectorAll('[data-delmovie]').forEach(b=>b.addEventListener('click', async ()=>{
    STATE.content.movies = STATE.content.movies.filter(x=>x.id!==b.dataset.delmovie);
    await saveContentGlobal(); render();
  }));
  const sf = document.getElementById('seriesForm');
  if(sf) sf.addEventListener('submit', async (e)=>{
    e.preventDefault(); const fd = new FormData(sf);
    const obj = {
      id: uid('s'), titleAr: fd.get('titleAr'), titleEn: fd.get('titleEn'), originalTitle: fd.get('titleEn'),
      descAr: fd.get('descAr'), descEn: fd.get('descEn'), year: parseInt(fd.get('year'))||new Date().getFullYear(),
      ageRating: fd.get('ageRating'), score:(7+Math.random()*2).toFixed(1)*1,
      genres: fd.get('genres').split(',').map(s=>s.trim()).filter(Boolean),
      cast: fd.get('cast').split(',').map(s=>s.trim()).filter(Boolean), creator: fd.get('creator'),
      seasons:[],
    };
    STATE.content.series.push(obj); await saveContentGlobal();
    toast(STATE.lang==='ar'?'تمت إضافة المسلسل':'Series added');
    STATE.params={tab:'series'}; render();
  });
  document.querySelectorAll('[data-manageeps]').forEach(b=>b.addEventListener('click',()=>{ STATE.params.manageSeriesId = b.dataset.manageeps; render(); }));
  document.querySelectorAll('[data-delseries]').forEach(b=>b.addEventListener('click', async ()=>{
    STATE.content.series = STATE.content.series.filter(x=>x.id!==b.dataset.delseries);
    await saveContentGlobal(); render();
  }));
  const nsf = document.getElementById('newSeasonForm');
  if(nsf) nsf.addEventListener('submit', async (e)=>{
    e.preventDefault(); const fd = new FormData(nsf);
    const s = STATE.content.series.find(x=>x.id===nsf.dataset.series);
    s.seasons = s.seasons||[]; s.seasons.push({number: parseInt(fd.get('num')), episodes:[]});
    await saveContentGlobal(); render();
  });
  document.querySelectorAll('.epForm').forEach(f=>f.addEventListener('submit', async (e)=>{
    e.preventDefault(); const fd = new FormData(f);
    const s = STATE.content.series.find(x=>x.id===f.dataset.series);
    const se = s.seasons.find(x=>x.number==f.dataset.season);
    const nextNum = se.episodes.length? Math.max(...se.episodes.map(e=>e.number))+1 : 1;
    se.episodes.push({
      number: nextNum, titleAr: fd.get('titleAr'), titleEn: fd.get('titleEn'),
      descAr: fd.get('descAr'), descEn: fd.get('descEn'), runtime: parseInt(fd.get('runtime'))||20,
      releaseDate: new Date().toISOString().slice(0,10),
      video:{ src: fd.get('video'), subtitles:[{lang:'ar',label:'العربية',src:SUB_AR},{lang:'en',label:'English',src:SUB_EN}], audio:[{lang:'en',label:'English'}] },
    });
    await saveContentGlobal();
    toast(STATE.lang==='ar'?'تمت إضافة الحلقة':'Episode added');
    render();
  }));
  document.querySelectorAll('[data-delep]').forEach(b=>b.addEventListener('click', async ()=>{
    const [sid,seasonNum,epNum] = b.dataset.delep.split(':');
    const s = STATE.content.series.find(x=>x.id===sid);
    const se = s.seasons.find(x=>x.number==seasonNum);
    se.episodes = se.episodes.filter(e=>e.number!=epNum);
    await saveContentGlobal(); render();
  }));
}
</script>
