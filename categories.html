<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RIOFLIX</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-wrap">
  <h1 class="page-title" id="pageTitle"></h1>
  <div id="catGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;"></div>
</div>

<script src="js/db.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script>
const profile = bootPage('categories');
const GENRE_COLORS = ['#FF5A2B','#F4C430','#4CA1FF','#7CE38B','#C77CFF','#FF6EC7','#FF8A5B','#5BD1D7'];

function render(){
  document.getElementById('pageTitle').textContent = t('categories');
  const all = DB.getTitles();
  const genres = new Map();
  all.forEach(tt=>(tt.genres||[]).forEach(g=>genres.set(g,(genres.get(g)||0)+1)));
  const grid = document.getElementById('catGrid');
  grid.innerHTML = [...genres.keys()].map((g,i)=>`
    <a href="browse.html?type=movie&genre=${encodeURIComponent(g)}" style="display:block;">
      <div style="aspect-ratio:16/8;border-radius:8px;background:linear-gradient(135deg, ${GENRE_COLORS[i%GENRE_COLORS.length]}, #000);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;letter-spacing:1px;">
        ${g}
      </div>
    </a>`).join('');
  renderFooter();
}
if(profile) render();
</script>
</body>
</html>
